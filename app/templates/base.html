<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bench &amp; Bolt{% endblock %}</title>
  <style>
    body { font: 17px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1d232a; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input, select, textarea { font: inherit; width: 100%; padding: .4rem; margin-top: .25rem; }
    .hint { color: #4d5763; font-size: .9rem; margin: .2rem 0 0; }
    .error { color: #a40000; font-weight: 600; margin: .25rem 0 0; }
    button { font: inherit; margin-top: 1.25rem; padding: .5rem 1rem; }
    .note { background: #f3f1ec; padding: .75rem 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <header><strong>Bench &amp; Bolt</strong> · repair queue (fictional customer, synthetic data)</header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
